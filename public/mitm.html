<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>StreamSaver Middleware</title>
  </head>
  <body>
    <script>
      // 中間人傳輸頁面
      // 用於在主頁面和 Service Worker 之間傳遞消息

      if ('serviceWorker' in navigator) {
        // 先設置消息處理器，再註冊 Service Worker
        let serviceWorkerReady = false;
        const pendingMessages = []; // 消息隊列

        window.onmessage = (evt) => {
          // 過濾掉瀏覽器插件的消息
          if (evt.data && typeof evt.data === 'object') {
            // 檢查是否是我們的消息（包含 transferringReadable 或 pathname）
            if (
              evt.data.transferringReadable !== undefined ||
              evt.data.pathname
            ) {
              if (!serviceWorkerReady) {
                pendingMessages.push({ data: evt.data, ports: evt.ports });
                return;
              }

              if (navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage(
                  evt.data,
                  evt.ports
                );
              }
            }
          }
        };

        navigator.serviceWorker
          .register('/sw.js', { scope: '/' })
          .then((reg) => {
            // 等待 Service Worker 激活
            return navigator.serviceWorker.ready;
          })
          .then((reg) => {
            serviceWorkerReady = true;

            // 處理隊列中的消息
            if (pendingMessages.length > 0) {
              pendingMessages.forEach((msg) => {
                if (navigator.serviceWorker.controller) {
                  navigator.serviceWorker.controller.postMessage(
                    msg.data,
                    msg.ports
                  );
                }
              });
              pendingMessages.length = 0; // 清空隊列
            }

            // 現在才發送 ready 信號
            window.parent.postMessage('stream-saver-ready', '*');
          })
          .catch((err) => {
            console.error('Service Worker registration failed:', err);
          });
      }
    </script>
  </body>
</html>
