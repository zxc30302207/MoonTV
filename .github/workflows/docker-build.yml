name: Docker Build and Push

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: '版本标签 (例如: v1.0.0)'
        required: false
        type: string
        default: ''
      include_latest:
        description: 'latest标签'
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Validate image tag
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
          INCLUDE_LATEST: ${{ inputs.include_latest }}
        run: |
          if [ -n "$VERSION_TAG" ] && ! [[ "$VERSION_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: use at most 128 letters, digits, underscores, periods or hyphens."
            exit 1
          fi
          if [ -z "$VERSION_TAG" ] && [ "$INCLUDE_LATEST" != "true" ]; then
            echo "Select latest or provide a version tag."
            exit 1
          fi

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            ${{ inputs.include_latest == true && 'type=raw,value=latest' || '' }}
            ${{ inputs.version_tag != '' && format('type=raw,value={0}', inputs.version_tag) || '' }}
          flavor: |
            latest=false

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像信息
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          VERSION_TAG: ${{ inputs.version_tag }}
          INCLUDE_LATEST: ${{ inputs.include_latest }}
        run: |
          {
            printf '%s\n' '### 🐳 Docker镜像构建成功！' '' '**镜像标签：**' '```'
            printf '%s\n' "$IMAGE_TAGS"
            printf '%s\n' '```'
            if [ -n "$VERSION_TAG" ]; then
              printf '**版本标签：** %s\n' "$VERSION_TAG"
            fi
            if [ "$INCLUDE_LATEST" = "true" ]; then
              printf '%s\n' '**包含latest标签：** 是'
            else
              printf '%s\n' '**包含latest标签：** 否'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
