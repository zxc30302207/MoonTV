name: Version Manager

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG
      - scripts/convert-changelog.js
      - src/lib/changelog.ts
      - src/lib/version.ts
      - VERSION.txt
  workflow_dispatch:

# Generate locally before committing; never auto-push to the deployed branch.
permissions:
  contents: read

concurrency:
  group: version-manager
  cancel-in-progress: true

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v3
        with:
          version: 10.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:version
